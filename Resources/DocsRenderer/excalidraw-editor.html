<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="artel-res://local/ext/excalidraw/entry.css">
<style>
  html, body, #app { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: -apple-system, sans-serif; }
  .error { padding: 16px; color: #cf222e; font-size: 13px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
// Excalidraw's editor for one .excalidraw file (ExcalidrawEditorView.swift). The native side calls
// artelEditor.load(json, theme) once the page says "ready", and gets "change" messages with the file's new JSON.
const post = (msg) => { try { window.webkit.messageHandlers.artel.postMessage(msg); } catch (e) { /* outside WKWebView */ } };
window.EXCALIDRAW_ASSET_PATH = 'artel-res://local/ext/excalidraw/';
let editor = null;
try {
  const mod = await import('artel-res://local/ext/excalidraw/entry.js');
  window.artelEditor = {
    load(json, theme) {
      if (editor) editor.unmount();
      editor = mod.mountEditor(document.getElementById('app'), {
        json, theme,
        onChange: (j) => post({ type: 'change', json: j }),
        onReady: () => post({ type: 'editorReady' }),
      });
    },
    setTheme(theme) { if (editor) editor.setTheme(theme); },
    json() { return editor ? editor.json() : null; },
  };
  post({ type: 'ready' });
} catch (e) {
  document.getElementById('app').innerHTML = `<div class="error">Couldn't load the Excalidraw editor: ${String(e && e.message || e)}</div>`;
  post({ type: 'log', text: String(e && e.stack || e) });
}
</script>
</body>
</html>
